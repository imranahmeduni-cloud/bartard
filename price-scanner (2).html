<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PriceScan - Compare Local Prices</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #334155;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app {
            min-height: 100vh;
            position: relative;
        }

        /* Animated background */
        .scan-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.2);
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 300px;
            height: 300px;
            background: rgba(236, 72, 153, 0.2);
            bottom: -50px;
            right: -50px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
            margin-bottom: 50px;
        }

        .header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header .tagline {
            font-size: 1.1rem;
            color: var(--text-dim);
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .scanner-section {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            display: none;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 60%;
            border: 3px solid #6366f1;
            border-radius: 12px;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .scan-overlay::before,
        .scan-overlay::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #6366f1;
            border-radius: 8px;
        }

        .scan-overlay::before {
            top: -4px;
            left: -4px;
            border-right: none;
            border-bottom: none;
        }

        .scan-overlay::after {
            bottom: -4px;
            right: -4px;
            border-left: none;
            border-top: none;
        }

        .scan-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        button.stop:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        .manual-input {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input {
            font-family: 'Outfit', sans-serif;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 14px 24px;
            font-size: 1rem;
            min-width: 300px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        input::placeholder {
            color: var(--text-dim);
        }

        .status {
            text-align: center;
            margin-top: 25px;
            padding: 16px 24px;
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text);
        }

        .results-section {
            margin-bottom: 50px;
            animation: fadeInUp 0.6s ease-out;
        }

        .product-info {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .product-name {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .product-barcode {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .price-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .price-card:hover::before {
            opacity: 1;
        }

        .price-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
        }

        .price-card.best-price {
            border: 2px solid var(--primary);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
        }

        .price-card.best-price::after {
            content: '✨ BEST PRICE';
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .retailer-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
        }

        .price {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .price-details {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stock-status {
            display: inline-block;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
            margin-top: 12px;
        }

        .stock-status.in-stock {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .stock-status.low-stock {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .view-product-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .view-product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #fca5a5;
            margin: 25px 0;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .price-grid {
                grid-template-columns: 1fr;
            }

            .scanner-section {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock product database
        const productDatabase = {
            '012000161551': {
                name: 'Coca-Cola Classic 12oz Can (12 Pack)',
                brand: 'Coca-Cola',
                category: 'Beverages'
            },
            '07874200619': {
                name: 'Tide Laundry Detergent 100oz',
                brand: 'Tide',
                category: 'Household'
            },
            '03400001520': {
                name: 'Cheerios Cereal 18oz',
                brand: 'General Mills',
                category: 'Breakfast'
            },
            '07800011036': {
                name: 'Lays Classic Potato Chips',
                brand: 'Frito-Lay',
                category: 'Snacks'
            }
        };

        // Mock retailer price data
        const generatePrices = (barcode) => {
            const basePrice = Math.random() * 20 + 5;
            const retailers = [
                { 
                    name: 'Target', 
                    distance: 1.2, 
                    variance: 0.95,
                    urlBase: 'https://www.target.com/s?searchTerm='
                },
                { 
                    name: 'Walmart', 
                    distance: 2.3, 
                    variance: 0.87,
                    urlBase: 'https://www.walmart.com/search?q='
                },
                { 
                    name: 'Whole Foods', 
                    distance: 0.8, 
                    variance: 1.15,
                    urlBase: 'https://www.amazon.com/s?k='
                },
                { 
                    name: 'Costco', 
                    distance: 3.5, 
                    variance: 0.80,
                    urlBase: 'https://www.costco.com/CatalogSearch?keyword='
                },
                { 
                    name: 'CVS', 
                    distance: 0.5, 
                    variance: 1.08,
                    urlBase: 'https://www.cvs.com/search?searchTerm='
                }
            ];

            const product = productDatabase[barcode] || { name: 'Product' };

            return retailers.map(retailer => ({
                retailer: retailer.name,
                price: (basePrice * retailer.variance).toFixed(2),
                distance: retailer.distance,
                inStock: Math.random() > 0.2,
                stockLevel: Math.random() > 0.7 ? 'in-stock' : 'low-stock',
                lastUpdated: 'Today',
                url: retailer.urlBase + encodeURIComponent(product.name + ' ' + barcode)
            })).sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
        };

        function App() {
            const [scanning, setScanning] = useState(false);
            const [barcode, setBarcode] = useState('');
            const [product, setProduct] = useState(null);
            const [prices, setPrices] = useState([]);
            const [loading, setLoading] = useState(false);
            const [status, setStatus] = useState('');
            const [error, setError] = useState('');
            const [manualBarcode, setManualBarcode] = useState('');

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamRef = useRef(null);

            const startScanning = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    streamRef.current = stream;
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setScanning(true);
                        setError('');
                        setStatus('Camera active - Position barcode in frame');
                        scanBarcode();
                    }
                } catch (err) {
                    setError('Camera access denied. Please enable camera permissions or enter barcode manually.');
                }
            };

            const stopScanning = () => {
                if (streamRef.current) {
                    streamRef.current.getTracks().forEach(track => track.stop());
                    streamRef.current = null;
                }
                setScanning(false);
                setStatus('');
            };

            const scanBarcode = () => {
                if (!scanning && !streamRef.current) return;

                const video = videoRef.current;
                const canvas = canvasRef.current;
                
                if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA) {
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code) {
                        setBarcode(code.data);
                        lookupProduct(code.data);
                        stopScanning();
                        return;
                    }
                }
                
                requestAnimationFrame(scanBarcode);
            };

            const lookupProduct = async (code) => {
                setLoading(true);
                setStatus(`Scanning barcode: ${code}`);
                
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                const productInfo = productDatabase[code] || {
                    name: `Product ${code.substring(0, 8)}...`,
                    brand: 'Generic Brand',
                    category: 'General'
                };
                
                setProduct(productInfo);
                const priceData = generatePrices(code);
                setPrices(priceData);
                setLoading(false);
                setStatus('Scan complete - Prices loaded');
            };

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (manualBarcode.trim()) {
                    setBarcode(manualBarcode);
                    lookupProduct(manualBarcode);
                    setManualBarcode('');
                }
            };

            useEffect(() => {
                return () => {
                    if (streamRef.current) {
                        streamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            return (
                <div className="app">
                    <div className="scan-bg">
                        <div className="floating-shape shape-1"></div>
                        <div className="floating-shape shape-2"></div>
                    </div>

                    <div className="container">
                        <header className="header">
                            <h1>PriceScan</h1>
                            <div className="tagline">Find the best prices at local retailers</div>
                        </header>

                        <div className="scanner-section">
                            <div className="video-container">
                                {scanning && (
                                    <>
                                        <video ref={videoRef} autoPlay playsInline />
                                        <div className="scan-overlay"></div>
                                    </>
                                )}
                                {!scanning && (
                                    <div style={{
                                        padding: '100px 20px',
                                        textAlign: 'center',
                                        color: 'var(--text-dim)',
                                        background: '#000'
                                    }}>
                                        Camera Inactive
                                    </div>
                                )}
                                <canvas ref={canvasRef} />
                            </div>

                            <div className="scan-controls">
                                {!scanning ? (
                                    <button onClick={startScanning}>
                                        Start Camera
                                    </button>
                                ) : (
                                    <button className="stop" onClick={stopScanning}>
                                        Stop Camera
                                    </button>
                                )}
                            </div>

                            <form onSubmit={handleManualSubmit} className="manual-input">
                                <input
                                    type="text"
                                    placeholder="Or enter barcode manually..."
                                    value={manualBarcode}
                                    onChange={(e) => setManualBarcode(e.target.value)}
                                />
                                <button type="submit">Lookup</button>
                            </form>

                            {status && <div className="status">{status}</div>}
                            {error && <div className="error">{error}</div>}
                        </div>

                        {loading && <div className="loading">Processing</div>}

                        {!loading && product && (
                            <div className="results-section">
                                <div className="product-info">
                                    <div className="product-name">{product.name}</div>
                                    <div className="product-barcode">
                                        {product.brand} | UPC: {barcode}
                                    </div>
                                </div>

                                {prices.length > 0 ? (
                                    <div className="price-grid">
                                        {prices.map((item, index) => (
                                            <div 
                                                key={index} 
                                                className={`price-card ${index === 0 ? 'best-price' : ''}`}
                                            >
                                                <div className="retailer-name">{item.retailer}</div>
                                                <div className="price">${item.price}</div>
                                                <div className="price-details">
                                                    📍 {item.distance} miles away
                                                </div>
                                                <div className="price-details">
                                                    🕒 Updated: {item.lastUpdated}
                                                </div>
                                                <div className={`stock-status ${item.stockLevel}`}>
                                                    {item.inStock ? 
                                                        (item.stockLevel === 'in-stock' ? 'In Stock' : 'Low Stock') 
                                                        : 'Out of Stock'}
                                                </div>
                                                <a 
                                                    href={item.url} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="view-product-btn"
                                                >
                                                    View at {item.retailer} →
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="no-results">
                                        No prices found for this product
                                    </div>
                                )}
                            </div>
                        )}

                        {!loading && !product && !error && (
                            <div className="no-results">
                                Scan or enter a barcode to compare prices
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
